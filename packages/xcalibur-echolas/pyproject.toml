[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcalibur-echolas"
version = "0.0.0"
description = "XcaliburAI domain package: Leishmania population genomics (ECHOLAS)."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["xcalibur-ai"]

[project.entry-points."xcalibur.domains"]
echolas = "xcalibur_echolas:plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xcalibur_echolas = ["manifest.yaml", "workflow/*", "workflow/**/*"]
