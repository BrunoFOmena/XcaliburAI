schema_version: 1
name: echolas
display_name: ECHOLAS - Leishmania population genomics
version: 0.0.0
description: >
  Short-read population genomics: adaptive QC and trimming, alignment, joint
  variant calling, filtering, PCA and maximum-likelihood phylogeny. Variant
  calling assumes a diploid organism (HaplotypeCaller --ploidy 2).
keywords:
  [leishmania, population, genomics, variants, phylogeny, pca, fastq, vcf, snp, clade]

workflow:
  engine: nextflow
  entrypoint: workflow/main.nf   # imported from MCamposDA/ECHOLAS (see workflow/NOTICE.md)
  # Image of the `docker` profile (packages/xcalibur-echolas/docker); tag = package version.
  container: ghcr.io/brunofomena/xcalibur-echolas:0.0.0

# Input names are also Nextflow params (--raw_data, --reference); both are directories.
inputs:
  - name: raw_data
    kind: fastq
    description: >
      Directory of gzip-compressed FASTQ files (.fastq.gz or .fq.gz), paired
      (<sample>_R1/_R2, _1/_2 or _R1_001/_R2_001, any case) or single-end (<sample>.fastq.gz).
    pattern: "*.{fastq,fq}.gz"
    multiple: true
  - name: reference
    kind: fasta
    description: Directory with exactly one reference genome (.fna, .fa or .fasta).
    pattern: "*.{fna,fa,fasta}"

params:
  - name: mode
    type: enum
    choices: [AUTO]
    default: AUTO
    description: >
      Trimming mode. AUTO picks conservative, intermediate or aggressive trimming per
      sample from its mean read quality. It is the only mode the pipeline implements.

outputs:
  - name: joint_vcf
    kind: vcf
    pattern: "results/filtering/final/strain_PASS.vcf.gz"
    description: Filtered joint call set (SNPs and indels that PASS the GATK filters).
  - name: pca
    kind: pdf
    pattern: "results/pca/**/strain_PC1_PC2.pdf"
    description: PCA plot (PC1 x PC2).
  - name: tree
    kind: newick
    pattern: "results/phylogeny/tree/**/strain_tree.treefile"
    description: Maximum-likelihood tree (IQ-TREE, UFBoot and SH-aLRT support).
