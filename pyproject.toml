[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcalibur-ai"
dynamic = ["version"]
description = "AI agents over workflow engines for genomics: chat, run, interpret."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "XcaliburAI cofounders" },
]
keywords = ["genomics", "bioinformatics", "nextflow", "agents", "llm"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = [
  "anthropic>=2.11,<3",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "anthropic>=2.11,<3",
  "httpx2>=2.16",
]

[project.scripts]
xcalibur = "xcalibur.cli:main"

[tool.setuptools.dynamic]
version = { attr = "xcalibur.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The end-to-end test runs the real pipeline; it is opt-in: pytest -m e2e (issue #11).
addopts = "-q -m 'not e2e'"
markers = ["e2e: runs a real workflow end to end (needs Nextflow and micromamba)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "packages/xcalibur-echolas/src", "tests"]
# Imported third-party pipeline code is kept as published (see its NOTICE.md).
extend-exclude = ["packages/*/src/*/workflow"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
