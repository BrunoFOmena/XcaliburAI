name: branch-policy

# Enforces the branch model:
#   work branch --PR--> homolog  (review, merge, test)
#   homolog --PR (merge commit)--> main
#
#   - PRs into homolog: any branch except main and promote/*, and never
#     bringing a commit of main (e.g. a work branch that merged main) (#33).
#   - PRs into main: only from the homolog branch of this repository.

on:
  pull_request:
    branches: [main, homolog]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check source and target branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "PR: $HEAD ($HEAD_REPO) -> $BASE"
          if [ "$BASE" = "main" ]; then
            if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
              echo "::error::PRs into 'main' must come from this repository."; exit 1
            fi
            .github/scripts/check-promotion.sh "$BASE_SHA" "$HEAD_SHA" "$HEAD"
          fi
          if [ "$BASE" = "homolog" ]; then
            git fetch --no-tags --quiet origin \
              +refs/heads/main:refs/remotes/origin/main \
              +refs/heads/homolog:refs/remotes/origin/homolog
            .github/scripts/check-homolog-pr.sh "$BASE_SHA" "$HEAD_SHA" "$HEAD" origin/main origin/homolog
          fi
          echo "Branch policy OK"
